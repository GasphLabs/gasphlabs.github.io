<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline' https://gc.zgo.at; img-src data: https://counterkeed.goatcounter.com; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; connect-src https://counterkeed.goatcounter.com;">

<title>gasph</title>
<style>
  :root{
    --bg: #000000;
    --text: #e7e7ea;
    --text-dim: #6b6b72;
    --accent: #f5a623;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Consolas, "Liberation Mono", Menlo, monospace;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
 
  .sr-only{
    position:absolute;
    width:1px; height:1px;
    padding:0; margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
  }
 
  .card{
    position:relative;
    z-index:1;
    text-align:center;
    padding: 2rem;
  }
 
  .name{
    font-size: clamp(2.4rem, 8vw, 4.2rem);
    letter-spacing: 0.02em;
    font-weight: 500;
    color: var(--text);
    position:relative;
    display:inline-block;
  }
 
  .name .ch{
    display:inline-block;
    width: 1ch;
  }
 
  .name::after{
    content:"";
    position:absolute;
    left:50%;
    bottom:-0.55rem;
    transform:translateX(-50%);
    width: 2.2rem;
    height: 2px;
    background: var(--accent);
  }
 
  .fields{
    margin-top: 2.6rem;
    display:flex;
    flex-direction:column;
    gap: 0.55rem;
    font-size: 0.85rem;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    text-transform: lowercase;
  }
 
  .fields span{
    transition: color 0.2s ease;
  }
 
  .fields span:hover{
    color: var(--text);
  }
 
  .contact{
    margin-top: 3rem;
    font-size: 0.78rem;
    color: var(--text-dim);
    letter-spacing: 0.04em;
  }
 
  .contact b{
    color: var(--accent);
    font-weight: 500;
  }
 
  @media (prefers-reduced-motion: no-preference){
    .card{ animation: rise 0.6s ease both; }
  }
  @keyframes rise{
    from{ opacity:0; transform: translateY(6px); }
    to{ opacity:1; transform: translateY(0); }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="name" id="brandName" aria-hidden="true">
      <span class="ch">g</span><span class="ch">a</span><span class="ch">s</span><span class="ch">p</span><span class="ch">h</span>
    </div>
    <span class="sr-only">gasph</span>
    <div class="fields">
      <span>distributed systems</span>
      <span>cloud infrastructure</span>
      <span>networks</span>
      <span>cybersecurity</span>
    </div>
    <div class="contact">discord — <b>gasph (absent until November 11)</b></div>
  </main>
 
<script>
(function(){
  "use strict";
 
  var reduceMotion = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  if (reduceMotion) return; // keep the name static, no scramble animation
 
  var ORIGINAL = ["g", "a", "s", "p", "h"];
  var UPPER = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  var LOWER = "abcdefghijklmnopqrstuvwxyz";
  var DIGITS = "0123456789";
  var SYMBOLS = "!\"#$%&'()*+,-./:;<=>?@[\\]^_`{|}~";
  var CHARSET = UPPER + LOWER + DIGITS + SYMBOLS;
 
  function randChar(){
    return CHARSET.charAt(Math.floor(Math.random() * CHARSET.length));
  }
 
  var container = document.getElementById("brandName");
  var chars = container ? Array.prototype.slice.call(container.querySelectorAll(".ch")) : [];
 
  var TOTAL_MS = 2000;     // how long the reels spin before settling
  var STEP_MS = 55;        // how often the values roll over — all letters together
  var INTERVAL_MS = 20000; // run every 20 seconds
 
  var running = false;
  var spinTimer = null;
 
  function stopMidGlitch(){
    if (spinTimer){ clearInterval(spinTimer); spinTimer = null; }
    if (running){
      chars.forEach(function(el, idx){
        el.textContent = ORIGINAL[idx];
      });
      running = false;
    }
  }
 
  function runGlitch(){
    if (running || chars.length === 0) return;
    running = true;
 
    var startTime = Date.now();
    spinTimer = setInterval(function(){
      var elapsed = Date.now() - startTime;
 
      if (elapsed >= TOTAL_MS){
        clearInterval(spinTimer);
        spinTimer = null;
        chars.forEach(function(el, idx){
          el.textContent = ORIGINAL[idx];
        });
        running = false;
        return;
      }
 
      chars.forEach(function(el){
        el.textContent = randChar();
      });
    }, STEP_MS);
  }
 
  var loopTimer = null;
  var initialTimer = null;
 
  function startLoop(){
    if (!loopTimer) loopTimer = setInterval(runGlitch, INTERVAL_MS);
  }
  function stopLoop(){
    if (loopTimer){ clearInterval(loopTimer); loopTimer = null; }
    if (initialTimer){ clearTimeout(initialTimer); initialTimer = null; }
  }
 
  document.addEventListener("visibilitychange", function(){
    if (document.hidden){
      stopLoop();
      stopMidGlitch();
    } else {
      startLoop();
    }
  });
 
  startLoop();
  initialTimer = setTimeout(runGlitch, 2000);
})();
</script>

</body>
</html>
